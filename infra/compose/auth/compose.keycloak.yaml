# Local identity provider for testing company sign-in (OIDC). Not for production:
# a customer uses their own provider (Entra ID, Google Workspace, Okta, Keycloak).
#
#   docker-compose -f infra/compose/auth/compose.keycloak.yaml up -d
#
# Realm "company" with the synthetic users is imported from fixtures/keycloak.
# It runs on its own; point the platform at it with the OIDC_* settings in
# docs/SIGN-IN.md.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-only}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ../../../fixtures/keycloak/company-realm.json:/opt/keycloak/data/import/company-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180 && echo -e 'GET /realms/company HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { cpus: "1", memory: 768M } } }
